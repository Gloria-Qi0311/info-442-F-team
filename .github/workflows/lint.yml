name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-husky-share "npm run test:rules"
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
